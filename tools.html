<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Encoder/Decoder Tool</title>
    <style>
        :root {
            --color-white: rgba(255, 255, 255, 1);
            --color-black: rgba(0, 0, 0, 1);
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-gray-200: rgba(245, 245, 245, 1);
            --color-gray-300: rgba(167, 169, 169, 1);
            --color-gray-400: rgba(119, 124, 124, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-brown-600: rgba(94, 82, 64, 1);
            --color-charcoal-700: rgba(31, 33, 33, 1);
            --color-charcoal-800: rgba(38, 40, 40, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-teal-300: rgba(50, 184, 198, 1);
            --color-teal-400: rgba(45, 166, 178, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-teal-700: rgba(26, 104, 115, 1);
            --color-red-400: rgba(255, 84, 89, 1);
            --color-red-500: rgba(192, 21, 47, 1);
            --color-brown-600-rgb: 94, 82, 64;
            --color-teal-500-rgb: 33, 128, 141;
            --color-slate-900-rgb: 19, 52, 59;
            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-primary-active: var(--color-teal-700);
            --color-secondary: rgba(var(--color-brown-600-rgb), 0.12);
            --color-secondary-hover: rgba(var(--color-brown-600-rgb), 0.2);
            --color-border: rgba(var(--color-brown-600-rgb), 0.2);
            --color-card-border: rgba(var(--color-brown-600-rgb), 0.12);
            --color-btn-primary-text: var(--color-cream-50);
            --color-error: var(--color-red-500);
            --color-focus-ring: rgba(var(--color-teal-500-rgb), 0.4);
            --font-family-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-family-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
            --font-size-sm: 12px;
            --font-size-base: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 18px;
            --font-size-2xl: 20px;
            --font-size-3xl: 24px;
            --font-weight-medium: 500;
            --font-weight-semibold: 550;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --space-32: 32px;
            --radius-base: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --color-gray-400-rgb: 119, 124, 124;
                --color-teal-300-rgb: 50, 184, 198;
                --color-gray-300-rgb: 167, 169, 169;
                --color-gray-200-rgb: 245, 245, 245;
                --color-background: var(--color-charcoal-700);
                --color-surface: var(--color-charcoal-800);
                --color-text: var(--color-gray-200);
                --color-text-secondary: rgba(var(--color-gray-300-rgb), 0.7);
                --color-primary: var(--color-teal-300);
                --color-primary-hover: var(--color-teal-400);
                --color-secondary: rgba(var(--color-gray-400-rgb), 0.15);
                --color-secondary-hover: rgba(var(--color-gray-400-rgb), 0.25);
                --color-border: rgba(var(--color-gray-400-rgb), 0.3);
                --color-card-border: rgba(var(--color-gray-400-rgb), 0.2);
                --color-error: var(--color-red-400);
                --color-btn-primary-text: var(--color-slate-900);
                --color-focus-ring: rgba(var(--color-teal-300-rgb), 0.4);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-base);
            background-color: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            padding: var(--space-24);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: var(--font-size-3xl);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--space-8);
            color: var(--color-text);
        }

        .subtitle {
            color: var(--color-text-secondary);
            margin-bottom: var(--space-32);
            font-size: var(--font-size-base);
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--space-16);
            margin-bottom: var(--space-32);
        }

        .tool-card {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-20);
            box-shadow: var(--shadow-sm);
            transition: all 0.2s;
        }

        .tool-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .tool-card h3 {
            font-size: var(--font-size-lg);
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--space-12);
            color: var(--color-text);
        }

        .tool-card p {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-16);
        }

        .main-panel {
            background: var(--color-surface);
            border: 1px solid var(--color-card-border);
            border-radius: var(--radius-lg);
            padding: var(--space-24);
            box-shadow: var(--shadow-sm);
        }

        .input-group {
            margin-bottom: var(--space-20);
        }

        label {
            display: block;
            font-weight: var(--font-weight-medium);
            margin-bottom: var(--space-8);
            color: var(--color-text);
            font-size: var(--font-size-base);
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: var(--space-12);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            font-family: var(--font-family-mono);
            font-size: var(--font-size-sm);
            background: var(--color-background);
            color: var(--color-text);
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-focus-ring);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-8);
            margin-bottom: var(--space-20);
        }

        .btn {
            padding: var(--space-12) var(--space-20);
            border: none;
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: var(--space-8);
        }

        .btn-primary {
            background: var(--color-primary);
            color: var(--color-btn-primary-text);
        }

        .btn-primary:hover {
            background: var(--color-primary-hover);
        }

        .btn-primary:active {
            background: var(--color-primary-active);
        }

        .btn-secondary {
            background: var(--color-secondary);
            color: var(--color-text);
        }

        .btn-secondary:hover {
            background: var(--color-secondary-hover);
        }

        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--color-focus-ring);
        }

        .output-area {
            margin-top: var(--space-20);
            padding: var(--space-16);
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            font-family: var(--font-family-mono);
            font-size: var(--font-size-sm);
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .error {
            color: var(--color-error);
            margin-top: var(--space-8);
            font-size: var(--font-size-sm);
        }

        .success {
            color: var(--color-primary);
            margin-top: var(--space-8);
            font-size: var(--font-size-sm);
        }

        .copy-btn {
            margin-top: var(--space-12);
        }

        .tab-container {
            display: flex;
            gap: var(--space-8);
            margin-bottom: var(--space-20);
            border-bottom: 1px solid var(--color-border);
            overflow-x: auto;
        }

        .tab {
            padding: var(--space-12) var(--space-20);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--color-text-secondary);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab:hover {
            color: var(--color-text);
            background: var(--color-secondary);
        }

        .tab.active {
            color: var(--color-primary);
            border-bottom-color: var(--color-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding: var(--space-16);
            }

            .tool-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="main-panel">
            <div class="tab-container">
                <button class="tab active" data-tab="base64">Base64</button>
                <button class="tab" data-tab="url">URL</button>
                <button class="tab" data-tab="html">HTML</button>
                <button class="tab" data-tab="hex">Hex</button>
                <button class="tab" data-tab="unicode">Unicode</button>
                <button class="tab" data-tab="jwt">JWT</button>
                <button class="tab" data-tab="hash">Hash</button>
                <button class="tab" data-tab="timestamp">Timestamp</button>
            </div>

            <!-- Base64 Tab -->
            <div class="tab-content active" id="base64">
                <div class="input-group">
                    <label for="base64-input">입력 텍스트</label>
                    <textarea id="base64-input" placeholder="인코딩/디코딩할 텍스트를 입력하세요..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeBase64()">🔒 Encode</button>
                    <button class="btn btn-secondary" onclick="decodeBase64()">🔓 Decode</button>
                    <button class="btn btn-secondary" onclick="clearInput('base64-input')">🗑️ Clear</button>
                </div>
                <div id="base64-output" class="output-area" style="display:none;"></div>
                <button class="btn btn-secondary copy-btn" onclick="copyToClipboard('base64-output')" style="display:none;" id="base64-copy">📋 Copy</button>
                <div id="base64-message"></div>
            </div>

            <!-- URL Tab -->
            <div class="tab-content" id="url">
                <div class="input-group">
                    <label for="url-input">입력 텍스트</label>
                    <textarea id="url-input" placeholder="인코딩/디코딩할 URL을 입력하세요..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeURL()">🔒 Encode</button>
                    <button class="btn btn-secondary" onclick="decodeURL()">🔓 Decode</button>
                    <button class="btn btn-secondary" onclick="clearInput('url-input')">🗑️ Clear</button>
                </div>
                <div id="url-output" class="output-area" style="display:none;"></div>
                <button class="btn btn-secondary copy-btn" onclick="copyToClipboard('url-output')" style="display:none;" id="url-copy">📋 Copy</button>
                <div id="url-message"></div>
            </div>

            <!-- HTML Tab -->
            <div class="tab-content" id="html">
                <div class="input-group">
                    <label for="html-input">입력 텍스트</label>
                    <textarea id="html-input" placeholder="인코딩/디코딩할 HTML을 입력하세요..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeHTML()">🔒 Encode</button>
                    <button class="btn btn-secondary" onclick="decodeHTML()">🔓 Decode</button>
                    <button class="btn btn-secondary" onclick="clearInput('html-input')">🗑️ Clear</button>
                </div>
                <div id="html-output" class="output-area" style="display:none;"></div>
                <button class="btn btn-secondary copy-btn" onclick="copyToClipboard('html-output')" style="display:none;" id="html-copy">📋 Copy</button>
                <div id="html-message"></div>
            </div>

            <!-- Hex Tab -->
            <div class="tab-content" id="hex">
                <div class="input-group">
                    <label for="hex-input">입력 텍스트</label>
                    <textarea id="hex-input" placeholder="인코딩/디코딩할 텍스트를 입력하세요..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeHex()">🔒 Encode</button>
                    <button class="btn btn-secondary" onclick="decodeHex()">🔓 Decode</button>
                    <button class="btn btn-secondary" onclick="clearInput('hex-input')">🗑️ Clear</button>
                </div>
                <div id="hex-output" class="output-area" style="display:none;"></div>
                <button class="btn btn-secondary copy-btn" onclick="copyToClipboard('hex-output')" style="display:none;" id="hex-copy">📋 Copy</button>
                <div id="hex-message"></div>
            </div>

            <!-- JWT Tab -->
            <div class="tab-content" id="jwt">
                <div class="input-group">
                    <label for="jwt-input">JWT 토큰</label>
                    <textarea id="jwt-input" placeholder="JWT 토큰을 입력하세요..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="decodeJWT()">🔓 Decode</button>
                    <button class="btn btn-secondary" onclick="clearInput('jwt-input')">🗑️ Clear</button>
                </div>
                <div id="jwt-output" class="output-area" style="display:none;"></div>
                <button class="btn btn-secondary copy-btn" onclick="copyToClipboard('jwt-output')" style="display:none;" id="jwt-copy">📋 Copy</button>
                <div id="jwt-message"></div>
            </div>

            <!-- Unicode Tab -->
            <div class="tab-content" id="unicode">
                <div class="input-group">
                    <label for="unicode-input">입력 텍스트</label>
                    <textarea id="unicode-input" placeholder="유니코드 인코딩/디코딩할 텍스트를 입력하세요..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="encodeUnicode()">🔒 Encode</button>
                    <button class="btn btn-secondary" onclick="decodeUnicode()">🔓 Decode</button>
                    <button class="btn btn-secondary" onclick="clearInput('unicode-input')">🗑️ Clear</button>
                </div>
                <div id="unicode-output" class="output-area" style="display:none;"></div>
                <button class="btn btn-secondary copy-btn" onclick="copyToClipboard('unicode-output')" style="display:none;" id="unicode-copy">📋 Copy</button>
                <div id="unicode-message"></div>
            </div>

            <!-- Hash Tab -->
            <div class="tab-content" id="hash">
                <div class="input-group">
                    <label for="hash-input">입력 텍스트</label>
                    <textarea id="hash-input" placeholder="해시를 생성할 텍스트를 입력하세요..."></textarea>
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="generateMD5()">MD5</button>
                    <button class="btn btn-primary" onclick="generateSHA1()">SHA-1</button>
                    <button class="btn btn-primary" onclick="generateSHA256()">SHA-256</button>
                    <button class="btn btn-secondary" onclick="clearInput('hash-input')">🗑️ Clear</button>
                </div>
                <div id="hash-output" class="output-area" style="display:none;"></div>
                <button class="btn btn-secondary copy-btn" onclick="copyToClipboard('hash-output')" style="display:none;" id="hash-copy">📋 Copy</button>
                <div id="hash-message"></div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;
                
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        function showOutput(outputId, content, copyBtnId) {
            const output = document.getElementById(outputId);
            const copyBtn = document.getElementById(copyBtnId);
            output.textContent = content;
            output.style.display = 'block';
            if (copyBtn) copyBtn.style.display = 'inline-flex';
        }

        function showMessage(messageId, text, isError = false) {
            const msg = document.getElementById(messageId);
            msg.textContent = text;
            msg.className = isError ? 'error' : 'success';
            setTimeout(() => msg.textContent = '', 3000);
        }

        function clearInput(inputId) {
            document.getElementById(inputId).value = '';
            const outputId = inputId.replace('-input', '-output');
            const copyBtnId = inputId.replace('-input', '-copy');
            const messageId = inputId.replace('-input', '-message');
            document.getElementById(outputId).style.display = 'none';
            const copyBtn = document.getElementById(copyBtnId);
            if (copyBtn) copyBtn.style.display = 'none';
            document.getElementById(messageId).textContent = '';
        }

        // Base64 functions
        function encodeBase64() {
            const input = document.getElementById('base64-input').value;
            if (!input) {
                showMessage('base64-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            try {
                const encoded = btoa(unescape(encodeURIComponent(input)));
                showOutput('base64-output', encoded, 'base64-copy');
                showMessage('base64-message', '✓ 인코딩 완료');
            } catch (e) {
                showMessage('base64-message', '인코딩 실패: ' + e.message, true);
            }
        }

        function decodeBase64() {
            const input = document.getElementById('base64-input').value;
            if (!input) {
                showMessage('base64-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            try {
                const decoded = decodeURIComponent(escape(atob(input)));
                showOutput('base64-output', decoded, 'base64-copy');
                showMessage('base64-message', '✓ 디코딩 완료');
            } catch (e) {
                showMessage('base64-message', '디코딩 실패: 잘못된 Base64 형식', true);
            }
        }

        // URL functions
        function encodeURL() {
            const input = document.getElementById('url-input').value;
            if (!input) {
                showMessage('url-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            try {
                const encoded = encodeURIComponent(input);
                showOutput('url-output', encoded, 'url-copy');
                showMessage('url-message', '✓ 인코딩 완료');
            } catch (e) {
                showMessage('url-message', '인코딩 실패: ' + e.message, true);
            }
        }

        function decodeURL() {
            const input = document.getElementById('url-input').value;
            if (!input) {
                showMessage('url-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            try {
                const decoded = decodeURIComponent(input);
                showOutput('url-output', decoded, 'url-copy');
                showMessage('url-message', '✓ 디코딩 완료');
            } catch (e) {
                showMessage('url-message', '디코딩 실패: 잘못된 URL 인코딩', true);
            }
        }

        // HTML functions
        function encodeHTML() {
            const input = document.getElementById('html-input').value;
            if (!input) {
                showMessage('html-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            const encoded = input
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;')
                .replace(/\//g, '&#x2F;');
            showOutput('html-output', encoded, 'html-copy');
            showMessage('html-message', '✓ 인코딩 완료');
        }

        function decodeHTML() {
            const input = document.getElementById('html-input').value;
            if (!input) {
                showMessage('html-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            const textarea = document.createElement('textarea');
            textarea.innerHTML = input;
            const decoded = textarea.value;
            showOutput('html-output', decoded, 'html-copy');
            showMessage('html-message', '✓ 디코딩 완료');
        }

        // Hex functions
        function encodeHex() {
            const input = document.getElementById('hex-input').value;
            if (!input) {
                showMessage('hex-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            const encoded = Array.from(input)
                .map(c => c.charCodeAt(0).toString(16).padStart(2, '0'))
                .join('');
            showOutput('hex-output', encoded, 'hex-copy');
            showMessage('hex-message', '✓ 인코딩 완료');
        }

        function decodeHex() {
            const input = document.getElementById('hex-input').value.replace(/\s/g, '');
            if (!input) {
                showMessage('hex-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            if (!/^[0-9a-fA-F]+$/.test(input) || input.length % 2 !== 0) {
                showMessage('hex-message', '디코딩 실패: 잘못된 Hex 형식', true);
                return;
            }
            try {
                const decoded = input.match(/.{1,2}/g)
                    .map(byte => String.fromCharCode(parseInt(byte, 16)))
                    .join('');
                showOutput('hex-output', decoded, 'hex-copy');
                showMessage('hex-message', '✓ 디코딩 완료');
            } catch (e) {
                showMessage('hex-message', '디코딩 실패: ' + e.message, true);
            }
        }

        // JWT functions
        function decodeJWT() {
            const input = document.getElementById('jwt-input').value.trim();
            if (!input) {
                showMessage('jwt-message', 'JWT 토큰을 입력하세요', true);
                return;
            }
            
            const parts = input.split('.');
            if (parts.length !== 3) {
                showMessage('jwt-message', '디코딩 실패: 잘못된 JWT 형식', true);
                return;
            }
            
            try {
                const header = JSON.parse(atob(parts[0].replace(/-/g, '+').replace(/_/g, '/')));
                const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                
                const result = '=== HEADER ===\n' + 
                    JSON.stringify(header, null, 2) + 
                    '\n\n=== PAYLOAD ===\n' + 
                    JSON.stringify(payload, null, 2) +
                    '\n\n=== SIGNATURE ===\n' + parts[2];
                
                showOutput('jwt-output', result, 'jwt-copy');
                showMessage('jwt-message', '✓ 디코딩 완료');
            } catch (e) {
                showMessage('jwt-message', '디코딩 실패: 잘못된 JWT 형식', true);
            }
        }

        // Hash functions (using SubtleCrypto API)
        async function generateHash(algorithm) {
            const input = document.getElementById('hash-input').value;
            if (!input) {
                showMessage('hash-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(input);
                const hashBuffer = await crypto.subtle.digest(algorithm, data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                showOutput('hash-output', hashHex, 'hash-copy');
                showMessage('hash-message', `✓ ${algorithm} 해시 생성 완료`);
            } catch (e) {
                showMessage('hash-message', '해시 생성 실패: ' + e.message, true);
            }
        }

        async function generateMD5() {
            const input = document.getElementById('hash-input').value;
            if (!input) {
                showMessage('hash-message', '입력 텍스트를 입력하세요', true);
                return;
            }
            
            // MD5 implementation (simplified)
            function md5(string) {
                function rotateLeft(value, amount) {
                    return (value << amount) | (value >>> (32 - amount));
                }
                
                function addUnsigned(x, y) {
                    const lsw = (x & 0xFFFF) + (y & 0xFFFF);
                    const msw = (x >> 16) + (y >> 16) + (lsw >> 16);
                    return (msw << 16) | (lsw & 0xFFFF);
                }
                
                function F(x, y, z) { return (x & y) | ((~x) & z); }
                function G(x, y, z) { return (x & z) | (y & (~z)); }
                function H(x, y, z) { return x ^ y ^ z; }
                function I(x, y, z) { return y ^ (x | (~z)); }
                
                function FF(a, b, c, d, x, s, ac) {
                    a = addUnsigned(a, addUnsigned(addUnsigned(F(b, c, d), x), ac));
                    return addUnsigned(rotateLeft(a, s), b);
                }
                
                function GG(a, b, c, d, x, s, ac) {
                    a = addUnsigned(a, addUnsigned(addUnsigned(G(b, c, d), x), ac));
                    return addUnsigned(rotateLeft(a, s), b);
                }
                
                function HH(a, b, c, d, x, s, ac) {
                    a = addUnsigned(a, addUnsigned(addUnsigned(H(b, c, d), x), ac));
                    return addUnsigned(rotateLeft(a, s), b);
                }
                
                function II(a, b, c, d, x, s, ac) {
                    a = addUnsigned(a, addUnsigned(addUnsigned(I(b, c, d), x), ac));
                    return addUnsigned(rotateLeft(a, s), b);
                }
                
                function convertToWordArray(string) {
                    let lWordCount;
                    const lMessageLength = string.length;
                    const lNumberOfWords_temp1 = lMessageLength + 8;
                    const lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64;
                    const lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16;
                    const lWordArray = new Array(lNumberOfWords - 1);
                    let lBytePosition = 0;
                    let lByteCount = 0;
                    
                    while (lByteCount < lMessageLength) {
                        lWordCount = (lByteCount - (lByteCount % 4)) / 4;
                        lBytePosition = (lByteCount % 4) * 8;
                        lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
                        lByteCount++;
                    }
                    
                    lWordCount = (lByteCount - (lByteCount % 4)) / 4;
                    lBytePosition = (lByteCount % 4) * 8;
                    lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
                    lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
                    lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
                    
                    return lWordArray;
                }
                
                function wordToHex(value) {
                    let wordToHexValue = '', wordToHexValue_temp = '', byte, count;
                    for (count = 0; count <= 3; count++) {
                        byte = (value >>> (count * 8)) & 255;
                        wordToHexValue_temp = '0' + byte.toString(16);
                        wordToHexValue = wordToHexValue + wordToHexValue_temp.substr(wordToHexValue_temp.length - 2, 2);
                    }
                    return wordToHexValue;
                }
                
                const x = convertToWordArray(string);
                let a = 0x67452301;
                let b = 0xEFCDAB89;
                let c = 0x98BADCFE;
                let d = 0x10325476;
                
                for (let k = 0; k < x.length; k += 16) {
                    const AA = a;
                    const BB = b;
                    const CC = c;
                    const DD = d;
                    
                    a = FF(a, b, c, d, x[k + 0], 7, 0xD76AA478);
                    d = FF(d, a, b, c, x[k + 1], 12, 0xE8C7B756);
                    c = FF(c, d, a, b, x[k + 2], 17, 0x242070DB);
                    b = FF(b, c, d, a, x[k + 3], 22, 0xC1BDCEEE);
                    a = FF(a, b, c, d, x[k + 4], 7, 0xF57C0FAF);
                    d = FF(d, a, b, c, x[k + 5], 12, 0x4787C62A);
                    c = FF(c, d, a, b, x[k + 6], 17, 0xA8304613);
                    b = FF(b, c, d, a, x[k + 7], 22, 0xFD469501);
                    a = FF(a, b, c, d, x[k + 8], 7, 0x698098D8);
                    d = FF(d, a, b, c, x[k + 9], 12, 0x8B44F7AF);
                    c = FF(c, d, a, b, x[k + 10], 17, 0xFFFF5BB1);
                    b = FF(b, c, d, a, x[k + 11], 22, 0x895CD7BE);
                    a = FF(a, b, c, d, x[k + 12], 7, 0x6B901122);
                    d = FF(d, a, b, c, x[k + 13], 12, 0xFD987193);
                    c = FF(c, d, a, b, x[k + 14], 17, 0xA679438E);
                    b = FF(b, c, d, a, x[k + 15], 22, 0x49B40821);
                    a = GG(a, b, c, d, x[k + 1], 5, 0xF61E2562);
                    d = GG(d, a, b, c, x[k + 6], 9, 0xC040B340);
                    c = GG(c, d, a, b, x[k + 11], 14, 0x265E5A51);
                    b = GG(b, c, d, a, x[k + 0], 20, 0xE9B6C7AA);
                    a = GG(a, b, c, d, x[k + 5], 5, 0xD62F105D);
                    d = GG(d, a, b, c, x[k + 10], 9, 0x2441453);
                    c = GG(c, d, a, b, x[k + 15], 14, 0xD8A1E681);
                    b = GG(b, c, d, a, x[k + 4], 20, 0xE7D3FBC8);
                    a = GG(a, b, c, d, x[k + 9], 5, 0x21E1CDE6);
                    d = GG(d, a, b, c, x[k + 14], 9, 0xC33707D6);
                    c = GG(c, d, a, b, x[k + 3], 14, 0xF4D50D87);
                    b = GG(b, c, d, a, x[k + 8], 20, 0x455A14ED);
                    a = GG(a, b, c, d, x[k + 13], 5, 0xA9E3E905);
                    d = GG(d, a, b, c, x[k + 2], 9, 0xFCEFA3F8);
                    c = GG(c, d, a, b, x[k + 7], 14, 0x676F02D9);
                    b = GG(b, c, d, a, x[k + 12], 20, 0x8D2A4C8A);
                    a = HH(a, b, c, d, x[k + 5], 4, 0xFFFA3942);
                    d = HH(d, a, b, c, x[k + 8], 11, 0x8771F681);
                    c = HH(c, d, a, b, x[k + 11], 16, 0x6D9D6122);
                    b = HH(b, c, d, a, x[k + 14], 23, 0xFDE5380C);
                    a = HH(a, b, c, d, x[k + 1], 4, 0xA4BEEA44);
                    d = HH(d, a, b, c, x[k + 4], 11, 0x4BDECFA9);
                    c = HH(c, d, a, b, x[k + 7], 16, 0xF6BB4B60);

                    c = HH(c, d, a, b, x[k + 15], 16, 0x1FA27CF8);
                    b = HH(b, c, d, a, x[k + 2], 23, 0xC4AC5665);
                    a = II(a, b, c, d, x[k + 0], 6, 0xF4292244);
                    d = II(d, a, b, c, x[k + 7], 10, 0x432AFF97);
                    c = II(c, d, a, b, x[k + 14], 15, 0xAB9423A7);
                    b = II(b, c, d, a, x[k + 5], 21, 0xFC93A039);
                    a = II(a, b, c, d, x[k + 12], 6, 0x655B59C3);
                    d = II(d, a, b, c, x[k + 3], 10, 0x8F0CCC92);
                    c = II(c, d, a, b, x[k + 10], 15, 0xFFEFF47D);
                    b = II(b, c, d, a, x[k + 1], 21, 0x85845DD1);
                    a = II(a, b, c, d, x[k + 8], 6, 0x6FA87E4F);
                    d = II(d, a, b, c, x[k + 15], 10, 0xFE2CE6E0);
                    c = II(c, d, a, b, x[k + 6], 15, 0xA3014314);
                    b = II(b, c, d, a, x[k + 13], 21, 0x4E0811A1);

                    b = II(b, c, d, a, x[k + 9], 21, 0xEB86D391);
                    
                    a = addUnsigned(a, AA);
                    b = addUnsigned(b, BB);
                    c = addUnsigned(c, CC);
                    d = addUnsigned(d, DD);
                }
                
                return (wordToHex(a) + wordToHex(b) + wordToHex(c) + wordToHex(d)).toLowerCase();
            }
            
            const hash = md5(input);
            showOutput('hash-output', hash, 'hash-copy');
            showMessage('hash-message', '✓ MD5 해시 생성 완료');

        // Copy to clipboard
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const messageId = elementId.replace('-output', '-message');
                showMessage(messageId, '✓ 클립보드에 복사되었습니다');
            }).catch(err => {
                const messageId = elementId.replace('-output', '-message');
                showMessage(messageId, '복사 실패: ' + err.message, true);
